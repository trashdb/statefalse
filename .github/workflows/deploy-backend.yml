name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Statefalse.slnx
      - run: dotnet test --no-restore Statefalse.slnx

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          dotnet restore Statefalse.slnx
          dotnet publish -c Release -r linux-x64 --self-contained \
            -o /tmp/publish backend/Statefalse.Api.csproj

      - name: Upload to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          test -n "${SSH_KNOWN_HOSTS:-}" || { echo "SSH_KNOWN_HOSTS secret is required"; exit 1; }
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          retry() {
            n=1
            until "$@"; do
              [ "$n" -ge 4 ] && { echo "Failed after $n attempts"; return 1; }
              echo "Attempt $n failed; retrying in $((n*10))s"
              sleep "$((n*10))"
              n=$((n+1))
            done
          }

          retry rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519 -o ConnectTimeout=20 -o ServerAliveInterval=15" \
            /tmp/publish/ ${{ vars.VPS_USER || 'root' }}@${{ vars.VPS_HOST || '49.13.88.205' }}:/opt/statefalse/

      - name: Restart service
        run: |
          set -e
          retry() {
            n=1
            until "$@"; do
              [ "$n" -ge 4 ] && { echo "Failed after $n attempts"; return 1; }
              echo "Attempt $n failed; retrying in $((n*10))s"
              sleep "$((n*10))"
              n=$((n+1))
            done
          }
          scp -i ~/.ssh/id_ed25519 -o ConnectTimeout=20 \
            deploy/statefalse.service \
            deploy/statefalse-backup.service \
            deploy/statefalse-backup.timer \
            deploy/backup-statefalse.sh \
            ${{ vars.VPS_USER || 'root' }}@${{ vars.VPS_HOST || '49.13.88.205' }}:/tmp/
          retry ssh -i ~/.ssh/id_ed25519 -o ConnectTimeout=20 \
            ${{ vars.VPS_USER || 'root' }}@${{ vars.VPS_HOST || '49.13.88.205' }} \
            "sudo install -d -m 755 /opt/statefalse/deploy /var/backups/statefalse /var/lib/statefalse /etc/statefalse &&
             sudo install -m 755 /tmp/backup-statefalse.sh /opt/statefalse/deploy/backup-statefalse.sh &&
             sudo install -m 644 /tmp/statefalse.service /etc/systemd/system/statefalse.service &&
             sudo install -m 644 /tmp/statefalse-backup.service /etc/systemd/system/statefalse-backup.service &&
             sudo install -m 644 /tmp/statefalse-backup.timer /etc/systemd/system/statefalse-backup.timer &&
             sudo test -s /etc/statefalse/statefalse.env &&
             sudo systemctl daemon-reload &&
             sudo systemctl enable statefalse statefalse-backup.timer &&
             sudo systemctl restart statefalse &&
             sudo systemctl start statefalse-backup.timer"

      - name: Health check
        run: |
          set -e
          n=1
          until ssh -i ~/.ssh/id_ed25519 -o ConnectTimeout=20 \
            ${{ vars.VPS_USER || 'root' }}@${{ vars.VPS_HOST || '49.13.88.205' }} \
            "curl -sf http://localhost:5000/health" >/dev/null 2>&1; do
            [ "$n" -ge 8 ] && { echo "Health check failed after $n attempts"; exit 1; }
            echo "Health not ready (attempt $n); retrying in 10s"
            sleep 10
            n=$((n+1))
          done
          echo "Health OK"
