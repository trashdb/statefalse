name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests-backend/**'
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test --no-restore
        working-directory: tests-backend

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Publish
        run: |
          dotnet publish -c Release -r linux-x64 --self-contained \
            -o /tmp/publish backend/Statefalse.Api.csproj

      - name: Upload to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ vars.VPS_HOST || '49.13.88.205' }} >> ~/.ssh/known_hosts 2>/dev/null

          retry() {
            n=1
            until "$@"; do
              [ "$n" -ge 4 ] && { echo "Failed after $n attempts"; return 1; }
              echo "Attempt $n failed; retrying in $((n*10))s"
              sleep "$((n*10))"
              n=$((n+1))
            done
          }

          retry rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519 -o ConnectTimeout=20 -o ServerAliveInterval=15" \
            /tmp/publish/ ${{ vars.VPS_USER || 'root' }}@${{ vars.VPS_HOST || '49.13.88.205' }}:/opt/statefalse/

      - name: Restart service
        run: |
          set -e
          retry() {
            n=1
            until "$@"; do
              [ "$n" -ge 4 ] && { echo "Failed after $n attempts"; return 1; }
              echo "Attempt $n failed; retrying in $((n*10))s"
              sleep "$((n*10))"
              n=$((n+1))
            done
          }
          retry ssh -i ~/.ssh/id_ed25519 -o ConnectTimeout=20 \
            ${{ vars.VPS_USER || 'root' }}@${{ vars.VPS_HOST || '49.13.88.205' }} \
            "sudo systemctl restart statefalse"

      - name: Health check
        run: |
          set -e
          n=1
          until ssh -i ~/.ssh/id_ed25519 -o ConnectTimeout=20 \
            ${{ vars.VPS_USER || 'root' }}@${{ vars.VPS_HOST || '49.13.88.205' }} \
            "curl -sf http://localhost:5000/health" >/dev/null 2>&1; do
            [ "$n" -ge 8 ] && { echo "Health check failed after $n attempts"; exit 1; }
            echo "Health not ready (attempt $n); retrying in 10s"
            sleep 10
            n=$((n+1))
          done
          echo "Health OK"
