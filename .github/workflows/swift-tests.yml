name: Swift Tests

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'StatefalseTests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'native/**'
      - 'StatefalseTests/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: swift-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test (macOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: |
          set -o pipefail
          cd native
          xcodebuild build -scheme Statefalse -project statefalse.xcodeproj \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath /tmp/statefalse-build 2>&1 | tee /tmp/statefalse-build.log

      - name: Surface build errors
        if: failure()
        run: |
          rg -i -e "error:" -e "failed" -e "fatal error" -e "xcodebuild:" /tmp/statefalse-build.log 2>/dev/null | tail -20 | sed 's/^/::error::/'
          tail -20 /tmp/statefalse-build.log 2>/dev/null | sed 's/^/::error::/'

      - name: Run Tests
        run: |
          cd native
          # SnapshotTests render SwiftUI/AppKit views and crash the hosted app
          # on headless runners (the `CI` env guard in SnapshotTesting.swift does
          # not propagate through the app host). Snapshots are validated locally.
          xcodebuild test -scheme StatefalseTests -project statefalse.xcodeproj \
            -destination 'platform=macOS' \
            -skip-testing:StatefalseTests/SnapshotTests \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath /tmp/statefalse-test \
            -resultBundlePath /tmp/statefalse-test.xcresult 2>&1 | tee /tmp/statefalse-test.log | xcpretty && exit ${PIPESTATUS[0]}

      - name: Surface test log in annotations
        if: failure()
        run: |
          rg -i -e "error" -e "failed" -e "crash" -e "signal" -e "killed" -e "xcodebuild:" /tmp/statefalse-test.log 2>/dev/null | tail -5 | sed 's/^/::error::/'
          tail -3 /tmp/statefalse-test.log 2>/dev/null | sed 's/^/::error::/'
