name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests-backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests-backend/**'

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Statefalse.slnx

      - name: Build
        run: dotnet build --no-restore Statefalse.slnx

      - name: Test
        run: dotnet test --no-build --settings tests-backend/coverlet.runsettings --collect:"XPlat Code Coverage" --logger trx --results-directory /tmp/test-results

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: /tmp/test-results

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: /tmp/test-results/**/*.cobertura.xml
