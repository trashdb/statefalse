name: Native Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example, v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate tag format
        id: tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build macOS artifact
    needs: validate
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}

      - name: Run native tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project native/statefalse.xcodeproj \
            -scheme StatefalseTests \
            -destination 'platform=macOS' \
            -jobs 1 \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skip-testing:StatefalseTests/SnapshotTests \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned Release app
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -project native/statefalse.xcodeproj \
            -scheme Statefalse \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package, validate and checksum
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/Statefalse.app"
          ZIP="Statefalse-${RELEASE_TAG}.zip"
          test -d "$APP"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")
          MARKETING_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")
          [[ "$BUNDLE_ID" == "com.statefalse.app" ]]
          [[ "$MARKETING_VERSION" == "$RELEASE_VERSION" ]]
           lipo "$APP/Contents/MacOS/Statefalse" -verify_arch arm64 x86_64

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > SHA256SUMS
          cat > release-manifest.txt <<EOF
          tag=$RELEASE_TAG
          version=$MARKETING_VERSION
          commit=$(git rev-parse HEAD)
          built_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          bundle_id=$BUNDLE_ID
          build_number=$BUILD_NUMBER
          architectures=$(file "$APP/Contents/MacOS/Statefalse" | sed 's/^.*: //')
          signing=unsigned
          notarized=false
          EOF

          ditto -x -k "$ZIP" "$RUNNER_TEMP/verify"
          test -d "$RUNNER_TEMP/verify/Statefalse.app"
          shasum -a 256 -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: statefalse-${{ needs.validate.outputs.tag }}
          path: |
            Statefalse-${{ needs.validate.outputs.tag }}.zip
            SHA256SUMS
            release-manifest.txt

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    environment:
      name: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: statefalse-${{ needs.validate.outputs.tag }}
          path: release-artifact

      - name: Verify downloaded artifact
        working-directory: release-artifact
        run: sha256sum -c SHA256SUMS

      - name: Publish GitHub Release
        working-directory: release-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "Statefalse-${RELEASE_TAG}.zip" \
            SHA256SUMS \
            release-manifest.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Statefalse $RELEASE_TAG" \
            --generate-notes

