name: Native Release Artifact

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build macOS artifact
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: |
          xcodebuild -project native/statefalse.xcodeproj -scheme Statefalse -configuration Release build \
            -destination 'platform=macOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
      - name: Package and checksum
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release/Statefalse.app' -print -quit)
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Statefalse-${GITHUB_REF_NAME}.zip
          shasum -a 256 Statefalse-${GITHUB_REF_NAME}.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: statefalse-${{ github.ref_name }}
          path: |
            Statefalse-${{ github.ref_name }}.zip
            SHA256SUMS

