name: Repository Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Check shell scripts
        run: shellcheck deploy.sh deploy/*.sh
      - name: Check no ignored secret is tracked
        run: |
          ! git ls-files --error-unmatch deploy/statefalse.env backend/appsettings.Production.json backend/appsettings.Development.json 2>/dev/null

