# Statefalse public API reverse proxy.
# Install into shared nginx conf.d only after DNS resolves and certificate exists.
# Certificate should cover statefalse.com, www.statefalse.com, and api.statefalse.com.
# The API runs as a host service on localhost:5000.

server {
    listen 80;
    listen [::]:80;
    server_name statefalse.com www.statefalse.com api.statefalse.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name statefalse.com www.statefalse.com;

    ssl_certificate     /etc/letsencrypt/live/statefalse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/statefalse.com/privkey.pem;

    include /etc/nginx/snippets/ssl-params.conf;

    root /var/www/statefalse;
    index index.html;

    access_log /var/log/nginx/statefalse.com.access.log;
    error_log  /var/log/nginx/statefalse.com.error.log warn;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.statefalse.com;

    ssl_certificate     /etc/letsencrypt/live/statefalse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/statefalse.com/privkey.pem;

    include /etc/nginx/snippets/ssl-params.conf;

    access_log /var/log/nginx/api.statefalse.com.access.log;
    error_log  /var/log/nginx/api.statefalse.com.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:5000;

        # SignalR requires an explicit HTTP/1.1 WebSocket upgrade through nginx.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

    }
}
