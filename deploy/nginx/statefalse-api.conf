# Statefalse public API reverse proxy.
# Install into shared nginx conf.d only after DNS resolves and certificate exists.
# Certificate should cover statefalse.com, www.statefalse.com, and api.statefalse.com.
# Current underlayer-net gateway reaching host port 5000: 172.18.0.1.

server {
    listen 80;
    listen [::]:80;
    server_name statefalse.com www.statefalse.com api.statefalse.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name statefalse.com www.statefalse.com;

    ssl_certificate     /etc/letsencrypt/live/statefalse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/statefalse.com/privkey.pem;

    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://api.statefalse.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.statefalse.com;

    ssl_certificate     /etc/letsencrypt/live/statefalse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/statefalse.com/privkey.pem;

    include /etc/nginx/snippets/ssl-params.conf;

    access_log /var/log/nginx/api.statefalse.com.access.log;
    error_log  /var/log/nginx/api.statefalse.com.error.log warn;

    location / {
        # Replace 172.18.0.1 if Docker underlayer-net gateway changes.
        proxy_pass http://172.18.0.1:5000;
        include /etc/nginx/snippets/proxy-params.conf;
    }
}
