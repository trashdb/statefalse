# Temporary ACME bootstrap vhost. Replace with statefalse-api.conf after certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name statefalse.com www.statefalse.com api.statefalse.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
